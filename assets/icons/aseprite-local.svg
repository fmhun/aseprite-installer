<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
  <title id="title">Locally built Aseprite</title>
  <desc id="description">A four-color pixel loader inside a checkerboard sprite silhouette.</desc>
  <defs>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#c8c9cb"/>
      <rect width="16" height="16" fill="#909296"/>
      <rect x="16" y="16" width="16" height="16" fill="#909296"/>
    </pattern>
  </defs>

  <path fill="#090b0f" d="M24 0h80v8h8v8h8v8h8v80h-8v8h-8v8h-8v8H24v-8h-8v-8H8V96H0V24h8v-8h8V8h8z"/>
  <path fill="url(#checker)" d="M24 8h80v8h8v8h8v72h-8v8h-8v8H24v-8h-8v-8H8V24h8v-8h8z"/>

  <!-- Compact centered loader; every black band is exactly 8 px wide. -->
  <rect x="40" y="40" width="48" height="48" fill="#090b0f"/>
  <rect x="48" y="48" width="12" height="12" fill="#f4c45c"/>
  <rect x="68" y="48" width="12" height="12" fill="#6ba8ff"/>
  <rect x="48" y="68" width="12" height="12" fill="#e36b78"/>
  <rect x="68" y="68" width="12" height="12" fill="#70d49c"/>
</svg>
