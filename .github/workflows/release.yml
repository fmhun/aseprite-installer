name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEBIAN_SMOKE_IMAGE: docker.io/library/debian:12-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
  FEDORA_SMOKE_IMAGE: docker.io/library/fedora:43@sha256:762d73ba1c455232b0272c5d445a34f36c4b9f421cbc05ce8102552325b6a222

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate tag, versions, and packaging policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const tauriConfig = JSON.parse(await readFile("src-tauri/tauri.conf.json", "utf8"));
          const macosConfig = JSON.parse(await readFile("src-tauri/tauri.macos.conf.json", "utf8"));
          const linuxConfig = JSON.parse(await readFile("src-tauri/tauri.linux.conf.json", "utf8"));
          const windowsConfig = JSON.parse(await readFile("src-tauri/tauri.windows.conf.json", "utf8"));
          const cargoToml = await readFile("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          const versions = new Set([packageJson.version, tauriConfig.version, cargoVersion]);
          if (versions.size !== 1 || versions.has(undefined)) {
            throw new Error(
              `Version mismatch: package=${packageJson.version}, tauri=${tauriConfig.version}, cargo=${cargoVersion}`,
            );
          }

          const expectedTag = `v${tauriConfig.version}`;
          if (!/^\d+\.\d+\.\d+$/.test(tauriConfig.version)) {
            throw new Error(`Release versions must use stable MAJOR.MINOR.PATCH syntax: ${tauriConfig.version}`);
          }
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.RELEASE_TAG}`);
          }

          const assertTargets = (name, actual, expected) => {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`${name} targets must be ${expected.join(", ")}`);
            }
          };

          assertTargets("macOS", macosConfig.bundle?.targets, ["app", "dmg"]);
          assertTargets("Linux", linuxConfig.bundle?.targets, ["appimage", "deb", "rpm"]);
          assertTargets("Windows", windowsConfig.bundle?.targets, ["nsis", "msi"]);

          if (tauriConfig.bundle?.createUpdaterArtifacts !== false) {
            throw new Error("Tauri updater artifacts must remain disabled.");
          }
          if (windowsConfig.bundle?.windows?.nsis?.installMode !== "currentUser") {
            throw new Error("The NSIS package must remain a current-user installer.");
          }
          if (windowsConfig.bundle?.windows?.wix?.upgradeCode !== "8969d2bf-7fec-5be0-8e91-3a8bf80c5201") {
            throw new Error("The stable MSI UpgradeCode changed unexpectedly.");
          }
          NODE
      - name: Verify the tagged commit belongs to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tagged_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG resolves to $tagged_commit, not event commit $GITHUB_SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA does not belong to main." >&2
            exit 1
          fi

  build:
    name: Build release bundle (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            arch: arm64
            stable_suffix: macOS-arm64
            artifact: release-macos-arm64
          - label: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            arch: x86_64
            stable_suffix: macOS-x64
            artifact: release-macos-x64
          - label: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            stable_suffix: Linux-x86_64
            artifact: release-linux-x64
          - label: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            stable_suffix: Windows-x64
            artifact: release-windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            curl \
            dbus-x11 \
            desktop-file-utils \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            procps \
            rpm \
            tar \
            wget \
            xdotool \
            xvfb
      - run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint native target
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked --target "${{ matrix.target }}" -- -D warnings
      - name: Test native target
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target "${{ matrix.target }}"
      - name: Build Windows bundles
        if: runner.os == 'Windows'
        run: npm run tauri build -- --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked
      - name: Build macOS bundles with bounded DMG retries
        if: runner.os == 'macOS'
        run: bash .github/scripts/build-macos-bundles.sh "${{ matrix.target }}"
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          umask 022
          bash .github/scripts/prepare-linux-appimage-runtime.sh
          npm run tauri build -- --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked
          shopt -s nullglob
          appimages=("src-tauri/target/${{ matrix.target }}/release/bundle/appimage/"*.AppImage)
          appdirs=("src-tauri/target/${{ matrix.target }}/release/bundle/appimage/"*.AppDir)
          if [[ "${#appimages[@]}" -ne 1 || "${#appdirs[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage and AppDir to normalize." >&2
            exit 1
          fi
          bash .github/scripts/normalize-linux-appimage-permissions.sh \
            "${appimages[0]}" \
            "${appdirs[0]}"
      - name: Verify and normalize macOS artifacts
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          STABLE_SUFFIX: ${{ matrix.stable_suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="src-tauri/target/${BUILD_TARGET}/release/bundle"
          app_path="${bundle_root}/macos/Aseprite Installer.app"
          dmg_files=("${bundle_root}/dmg/"*.dmg)
          if [[ ! -d "$app_path" || "${#dmg_files[@]}" -ne 1 ]]; then
            echo "Expected one macOS app and one DMG." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep 'Signature=adhoc' >/dev/null
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          executable_path="$app_path/Contents/MacOS/$executable_name"
          lipo "$executable_path" -verify_arch "$EXPECTED_ARCH"
          if [[ "$(lipo "$executable_path" -archs)" != "$EXPECTED_ARCH" ]]; then
            echo "The macOS executable contains an unexpected architecture." >&2
            exit 1
          fi

          hdiutil verify "${dmg_files[0]}"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "${dmg_files[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/Aseprite Installer.app"
          if find "$mount_dir" \( -name 'Aseprite.app' -o -name 'aseprite' -o -name 'aseprite.exe' -o -iname 'Aseprite-v*-Source.zip' -o -iname 'Skia-*-Release-*.zip' -o -iname 'libskia*' -o -iname 'skia.lib' -o -iname 'skia.dll' -o -iname 'icudtl.dat' \) -print -quit | grep -q .; then
            echo "The DMG contains a forbidden upstream payload." >&2
            exit 1
          fi
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
          trap - EXIT

          mkdir release-out
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-out/Aseprite-Installer-${STABLE_SUFFIX}.app.zip"
          cp "${dmg_files[0]}" "release-out/Aseprite-Installer-${STABLE_SUFFIX}.dmg"

          verify_dir="$(mktemp -d)"
          ditto -x -k "release-out/Aseprite-Installer-${STABLE_SUFFIX}.app.zip" "$verify_dir"
          codesign --verify --deep --strict --verbose=2 "$verify_dir/Aseprite Installer.app"
          if find "$verify_dir/Aseprite Installer.app" \( -name 'Aseprite.app' -o -name 'aseprite' -o -name 'aseprite.exe' -o -iname 'Aseprite-v*-Source.zip' -o -iname 'Skia-*-Release-*.zip' -o -iname 'libskia*' -o -iname 'skia.lib' -o -iname 'skia.dll' -o -iname 'icudtl.dat' \) -print -quit | grep -q .; then
            echo "The macOS installer bundle contains a forbidden upstream payload." >&2
            exit 1
          fi
          rm -r "$verify_dir"
      - name: Verify and normalize Linux artifacts
        if: runner.os == 'Linux'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          STABLE_SUFFIX: ${{ matrix.stable_suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="src-tauri/target/${BUILD_TARGET}/release/bundle"
          appimages=("${bundle_root}/appimage/"*.AppImage)
          debs=("${bundle_root}/deb/"*.deb)
          rpms=("${bundle_root}/rpm/"*.rpm)
          if [[ "${#appimages[@]}" -ne 1 || "${#debs[@]}" -ne 1 || "${#rpms[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage, deb, and rpm." >&2
            exit 1
          fi

          bash .github/scripts/linux-package-smoke.sh all \
            "${appimages[0]}" \
            "${debs[0]}" \
            "${rpms[0]}"

          mkdir release-out
          cp "${appimages[0]}" "release-out/Aseprite-Installer-${STABLE_SUFFIX}.AppImage"
          cp "${debs[0]}" "release-out/Aseprite-Installer-${STABLE_SUFFIX}.deb"
          cp "${rpms[0]}" "release-out/Aseprite-Installer-${STABLE_SUFFIX}.rpm"
          chmod 0755 "release-out/Aseprite-Installer-${STABLE_SUFFIX}.AppImage"

      - name: Verify and normalize Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          STABLE_SUFFIX: ${{ matrix.stable_suffix }}
          EXPECTED_UPGRADE_CODE: 8969d2bf-7fec-5be0-8e91-3a8bf80c5201
        run: |
          $smokeParameters = @{
            BundleRoot = "src-tauri/target/$env:BUILD_TARGET/release/bundle"
            BuiltExecutable = "src-tauri/target/$env:BUILD_TARGET/release/aseprite-installer.exe"
            ExpectedUpgradeCode = $env:EXPECTED_UPGRADE_CODE
            OutputDirectory = "release-out"
            StableSuffix = $env:STABLE_SUFFIX
          }
          & .github/scripts/windows-package-smoke.ps1 @smokeParameters
      - name: Upload isolated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect and checksum release assets
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download all isolated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Enforce the release allow-list and generate checksums
        run: |
          set -euo pipefail
          expected=(
            Aseprite-Installer-Linux-x86_64.AppImage
            Aseprite-Installer-Linux-x86_64.deb
            Aseprite-Installer-Linux-x86_64.rpm
            Aseprite-Installer-Windows-x64-setup.exe
            Aseprite-Installer-Windows-x64.msi
            Aseprite-Installer-macOS-arm64.app.zip
            Aseprite-Installer-macOS-arm64.dmg
            Aseprite-Installer-macOS-x64.app.zip
            Aseprite-Installer-macOS-x64.dmg
          )

          if find dist -mindepth 2 -print -quit | grep -q .; then
            echo "Release artifact collection contains nested content." >&2
            exit 1
          fi
          mapfile -t actual < <(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [[ "$(printf '%s\n' "${actual[@]}")" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
            echo "Release artifact allow-list mismatch." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$(printf '%s\n' "${wanted[@]}")" "$(printf '%s\n' "${actual[@]}")" >&2
            exit 1
          fi

          for name in "${expected[@]}"; do
            test -f "dist/$name"
            test ! -L "dist/$name"
          done

          (
            cd dist
            LC_ALL=C sha256sum "${expected[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload the complete release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest release provenance
    needs: collect
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the complete release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist
      - name: Generate GitHub build-provenance attestations
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

  publish:
    name: Publish complete release
    needs: [validate, build, collect, attest]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Download the attested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist
      - name: Reverify checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
      - name: Revalidate the release ref immediately before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tagged_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG moved to $tagged_commit; expected $GITHUB_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA no longer belongs to main." >&2
            exit 1
          fi
      - name: Create draft, upload allow-listed assets, and publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BODY: |
            Aseprite Installer builds Aseprite locally from verified official source releases. This release contains the installer only: it does not contain Aseprite or Skia binaries, source archives, or branding.

            Packages:
            - macOS 15.2+: arm64 and x64 app archives and DMGs (ad-hoc signed, not notarized)
            - Linux x86_64: AppImage, deb, and rpm (direct assets unsigned; signed APT repository metadata is published separately on GitHub Pages)
            - Windows 11 x64: current-user NSIS and administratively deployed MSI (unsigned; SmartScreen may warn)

            Verify direct downloads with `SHA256SUMS` and GitHub's build-provenance attestations. Aseprite Installer has no built-in updater; signed APT repository installations update through APT, while direct packages must be replaced with a newer release.
        run: |
          set -euo pipefail
          expected=(
            Aseprite-Installer-Linux-x86_64.AppImage
            Aseprite-Installer-Linux-x86_64.deb
            Aseprite-Installer-Linux-x86_64.rpm
            Aseprite-Installer-Windows-x64-setup.exe
            Aseprite-Installer-Windows-x64.msi
            Aseprite-Installer-macOS-arm64.app.zip
            Aseprite-Installer-macOS-arm64.dmg
            Aseprite-Installer-macOS-x64.app.zip
            Aseprite-Installer-macOS-x64.dmg
            SHA256SUMS
          )

          if find dist -mindepth 2 -print -quit | grep -q .; then
            echo "Refusing to publish nested release content." >&2
            exit 1
          fi
          mapfile -t local_assets < <(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [[ "$(printf '%s\n' "${local_assets[@]}")" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
            echo "Refusing to publish a non-allow-listed release set." >&2
            exit 1
          fi

          assert_remote_tag() {
            local remote_commit
            remote_commit="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
              --jq .sha)"
            if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
              echo "Remote tag $RELEASE_TAG resolves to $remote_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          }

          assert_remote_tag
          existing_state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$existing_state" == "false" ]]; then
            echo "Release $RELEASE_TAG is already published; refusing to mutate it." >&2
            exit 1
          fi
          if [[ -z "$existing_state" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Aseprite Installer ${RELEASE_TAG}" \
              --notes "$RELEASE_BODY"
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Aseprite Installer ${RELEASE_TAG}" \
              --notes "$RELEASE_BODY"
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

          mapfile -t remote_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | LC_ALL=C sort
          )
          if [[ "$(printf '%s\n' "${remote_assets[@]}")" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
            echo "Draft release asset allow-list mismatch; leaving the release unpublished." >&2
            exit 1
          fi

          release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid release id: $release_id" >&2
            exit 1
          fi
          assert_remote_tag
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            --silent

          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "Release publication was not confirmed." >&2
            exit 1
          fi
