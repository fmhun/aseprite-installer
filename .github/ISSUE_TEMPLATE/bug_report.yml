name: Bug report
description: Report a reproducible problem with Aseprite Installer
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Aseprite Installer. This tracker is for the installer, not Aseprite itself. Remove secrets, usernames, and personal paths from logs before attaching them.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: This problem is caused by Aseprite Installer, not by Aseprite itself.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and when it occurs.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that consistently triggers the problem.
      placeholder: |
        1. Open Aseprite Installer
        2. Choose ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Interface or window layout
        - Release selection
        - Requirements or build tools
        - Download or verification
        - Compilation
        - Installation, update, restore, or uninstall
        - Start menu, desktop menu, Applications, or launch/reveal integration
        - Installer package or application startup
        - Other
    validations:
      required: true

  - type: input
    id: installer-version
    attributes:
      label: Aseprite Installer version
      description: Find this in the application package or release name.
      placeholder: vX.Y.Z
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: Include the Windows build or Linux distribution release when available.
      placeholder: macOS 15.2, Windows 11 24H2 build 26100, or Ubuntu 22.04
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Apple Silicon (arm64)
        - Intel/AMD x86_64
        - Other or unknown
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Installer package
      options:
        - macOS app archive
        - macOS DMG
        - Linux AppImage
        - Linux deb
        - Linux rpm
        - Windows NSIS
        - Windows MSI
        - Development build
        - Unknown
    validations:
      required: true

  - type: input
    id: linux-distribution
    attributes:
      label: Linux distribution and desktop
      description: Required only for Linux reports. Include distribution, version, desktop environment, and session type when known.
      placeholder: Fedora 42, GNOME 48, Wayland

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant section. Remove secrets, usernames, and personal paths first.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag images or recordings here when they help demonstrate the problem.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help reproduce or diagnose the issue.
