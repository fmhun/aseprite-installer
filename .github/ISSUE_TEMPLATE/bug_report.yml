name: Bug report
description: Report a reproducible problem with Aseprite Installer
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Aseprite Installer. This tracker is for the installer, not Aseprite itself.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: This problem is caused by Aseprite Installer, not by Aseprite itself.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and when it occurs.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that consistently triggers the problem.
      placeholder: |
        1. Open Aseprite Installer
        2. Choose ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Interface or window layout
        - Release selection
        - Requirements or build tools
        - Download or verification
        - Compilation
        - Installation, update, restore, or uninstall
        - Other
    validations:
      required: true

  - type: input
    id: installer-version
    attributes:
      label: Aseprite Installer version
      description: Find this in the application bundle or release name.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.2
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant section. Remove secrets and personal information first.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag images or recordings here when they help demonstrate the problem.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help reproduce or diagnose the issue.
