[package]
name = "aseprite-installer"
version = "0.1.0"
description = "Compile and manage a personal Aseprite installation from official sources"
authors = ["fmhun"]
edition = "2021"
license = "MIT"

[lib]
name = "aseprite_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "macos-system-configuration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }
trash = "5"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
